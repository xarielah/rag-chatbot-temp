services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    ports:
      - "5432:5432"

  qdrant:
    ports:
      - "6333:6333"

  ingest:
    volumes:
      - ./backend:/app