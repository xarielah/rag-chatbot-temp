services:
  qdrant:
    image: qdrant/qdrant:latest   # מומלץ לנעול לאותה גרסה של Qdrant Cloud
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  ingest:
    build: ./backend
    command: python -m app.ingest
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DOCS_DIR: /data/docs
    volumes:
      - ./docs:/data/docs:ro
    depends_on:
      - qdrant
    profiles: ["tools"]

volumes:
  qdrant_data: