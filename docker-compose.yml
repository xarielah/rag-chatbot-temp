services:
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_dev_password
      POSTGRES_DB: rag
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000}"
    env_file: .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      # set DATABASE_URL in .env to use a cloud Postgres (add ?sslmode=require if needed)
      DATABASE_URL: ${DATABASE_URL:-postgresql://rag:rag_dev_password@postgres:5432/rag}
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ingest:
    build: ./backend
    command: python -m app.ingest
    env_file: .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      DOCS_DIR: /data/docs
    volumes:
      - ./docs:/data/docs:ro
    depends_on:
      - qdrant
    profiles: ["tools"]

volumes:
  qdrant_data:
  pg_data: